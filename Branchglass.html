/** Explicit GitHub API integration. Tokens live only in this instance, never

  const fieldHTML=f=>f.type==='checkbox'?`<label class="check-line"><input type="checkbox" name="${esc(f.name)}" ${f.value?'checked':''}>${esc(f.label)}</label>`:`<label class="form-field"><span>${esc(f.label)}</span>${f.type==='textarea'?`<textarea name="${esc(f.name)}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}" rows="${f.rows||4}">${esc(f.value||'')}</textarea>`:f.type==='select'?`<select name="${esc(f.name)}">${f.options.map(o=>typeof o==='string'?{value:o,label:o}:o).map(o=>`<option value="${esc(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<input type="${esc(f.type||'text')}" name="${esc(f.name)}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''} ${f.min?`min="${esc(f.min)}"`:''} ${f.max?`max="${esc(f.max)}"`:''} autocomplete="off" spellcheck="false">`}${f.help?`<small>${esc(f.help)}</small>`:''}</label>`;
  const d=showDialog(`<form id="modal-form"><div class="dialog-header"><div><h2>${esc(title)}</h2>${description?`<p>${esc(description)}</p>`:''}</div><button class="icon-button" type="button" data-action="closeDialog" aria-label="Close dialog">${icon('x')}</button></div><div class="dialog-body">${extra}${fields.map(fieldHTML).join('')}<div class="form-error" hidden></div></div><div class="dialog-footer"><button class="button" type="button" data-action="closeDialog">Cancel</button><button class="button ${danger?'danger':'primary'}" type="submit">${esc(submit)}</button></div></form>`,{wide});
  return new Promise(resolve=>{
    let done=false;const finish=value=>{if(done)return;done=true;resolve(value);};
    d.addEventListener('close',()=>finish(null),{once:true});
    $('#modal-form',d).addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=$('button[type=submit]',form),error=$('.form-error',form);button.disabled=true;error.hidden=true;const fd=new FormData(form),values=Object.fromEntries(fd);for(const f of fields)if(f.type==='checkbox')values[f.name]=fd.has(f.name);try{const result=await onSubmit(values);finish(result??values);d.close();}catch(e){error.textContent=e.message;error.hidden=false;}finally{button.disabled=false;}});
  });
}

async function handleStore(op,key,value){return new Promise((resolve,reject)=>{const req=indexedDB.open('branchglass-handles',1);req.onupgradeneeded=()=>req.result.createObjectStore('handles',{keyPath:'id'});req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result,tx=db.transaction('handles',op==='getAll'?'readonly':'readwrite'),store=tx.objectStore('handles');const task=op==='getAll'?store.getAll():op==='delete'?store.delete(key):store.put({id:key,...value});task.onsuccess=()=>resolve(task.result);task.onerror=()=>reject(task.error);tx.oncomplete=()=>db.close();};});}

async function refresh({preserveEditor=true,quiet=false}={}){
  const request=++S.refreshRequest;
  const snapshot=await S.provider.call('snapshot',{limit:S.limit,search:S.historySearch,branch:S.historyBranch,author:S.historyAuthor,path:S.historyPath});
  if(request!==S.refreshRequest)return;
  S.snapshot=snapshot;
  if(!S.repoTabs.some(r=>r.id===snapshot.repo.id))S.repoTabs.push({...snapshot.repo,provider:S.provider});
  if(!preserveEditor)S.editor=null;
  renderChrome();renderSidebar();renderInspector();
  if(S.builtView!==S.view)await buildMain();
  else if(['history','changes','files'].includes(S.view)){
    if(S.view==='history')await renderHistory();
    if(S.view==='files'){await renderTreeList();if(!S.editor)await chooseInitialFile();}
    else {if(S.commitOid){try{S.commitFiles=await S.provider.call('commitFiles',{oid:S.commitOid});}catch{S.commitFiles=[];}}
      renderFileList();if(!S.editor){if(!fileStillAvailable())S.file=null;await chooseInitialFile();}}
  }else if(!quiet)await renderToolView();
}

}

async function interactiveRebase(){
  const first=await formDialog({title:'Plan an interactive rebase',description:'Choose the upstream commit before the series to rewrite. Linear histories only; merge commits are rejected rather than flattened silently.',fields:[{name:'base',label:'Upstream branch or commit',required:true,value:'HEAD~3'}],submit:'Build plan'});if(!first)return;
  const result=await task('Building rebase plan',()=>S.provider.call('rebasePlan',{base:first.base}));const plan=result.commits.map(c=>({...c,action:'pick',message:c.subject}));
  if(!plan.length)throw Error('There are no commits after that base.');
  const dialog=showDialog(`<div class="dialog-header"><div><h2>Write a clearer history.</h2><p>Oldest first. Reorder, reword, squash, fix up, or drop commits. This rewrites the current branch.</p></div><button class="icon-button" data-action="closeDialog" aria-label="Close">${icon('x')}</button></div><div class="dialog-body"><div class="notice warning">Start from a clean working tree. A squash or fixup must follow a retained commit. Use this on unpublished work, or coordinate with collaborators.</div><div id="rebase-plan" class="rebase-plan"></div><div class="form-error" id="rebase-error" hidden></div></div><div class="dialog-footer"><button class="button" data-action="closeDialog">Cancel</button><button class="button danger" id="execute-rebase">Rewrite history</button></div>`,{wide:true});
  const render=()=>{$('#rebase-plan').innerHTML=plan.map((c,i)=>`<div class="rebase-row" draggable="true" data-index="${i}"><span class="drag-grip">${icon('drag')}</span><select data-rebase-index="${i}" aria-label="Action for ${esc(c.subject)}">${['pick','reword','squash','fixup','drop'].map(a=>`<option ${a===c.action?'selected':''}>${a}</option>`).join('')}</select><code>${short(c.oid)}</code><input value="${esc(c.message)}" data-rebase-message="${i}" aria-label="Commit message" ${c.action==='reword'?'':'readonly'}><button class="icon-button" data-move="-1" data-index="${i}" aria-label="Move commit up" ${i===0?'disabled':''}>${icon('up')}</button><button class="icon-button" data-move="1" data-index="${i}" aria-label="Move commit down" ${i===plan.length-1?'disabled':''}>${icon('down')}</button></div>`).join('');};render();
  let dragIndex=-1;
  dialog.onchange=e=>{if(e.target.dataset.rebaseIndex!==undefined){plan[+e.target.dataset.rebaseIndex].action=e.target.value;render();}};
  dialog.oninput=e=>{if(e.target.dataset.rebaseMessage!==undefined)plan[+e.target.dataset.rebaseMessage].message=e.target.value;};
  dialog.onclick=e=>{const b=e.target.closest('[data-move]');if(b){const i=+b.dataset.index,j=i+Number(b.dataset.move);[plan[i],plan[j]]=[plan[j],plan[i]];render();}};
  dialog.ondragstart=e=>{dragIndex=Number(e.target.closest('.rebase-row')?.dataset.index??-1);};dialog.ondragover=e=>e.preventDefault();dialog.ondrop=e=>{e.preventDefault();const target=Number(e.target.closest('.rebase-row')?.dataset.index??-1);if(dragIndex>=0&&target>=0){const [item]=plan.splice(dragIndex,1);plan.splice(target,0,item);render();}};
  dialog.addEventListener('close',()=>{dialog.onchange=dialog.oninput=dialog.onclick=dialog.ondragstart=dialog.ondragover=dialog.ondrop=null;},{once:true});
  $('#execute-rebase').onclick=async e=>{e.currentTarget.disabled=true;try{await perform('rebaseInteractive',{base:result.base||first.base,plan:plan.map(({oid,action,message})=>({oid,action,message}))},'Rewriting history');dialog.close();}catch(error){$('#rebase-error').textContent=error.message;$('#rebase-error').hidden=false;}finally{if($('#execute-rebase'))$('#execute-rebase').disabled=false;}};
}

async function resolveConflict(path){path=path||S.file?.path;if(!path)throw Error('Select a conflicted file.');if(!await canNavigate())return;const data=await S.provider.call('conflict',{path});let blocks=splitConflict(data.result);const d=showDialog(`<div class="dialog-header"><div><h2>Bring both sides together.</h2><p>${esc(path)} · edit the result, then save and stage the resolution.</p></div><button class="icon-button" data-action="closeDialog" aria-label="Close">${icon('x')}</button></div><div class="dialog-body merge-body"><div class="merge-inputs">${[['base','BASE'],['ours','OURS · current branch'],['theirs','THEIRS · incoming']].map(([key,label])=>`<section><header>${label}</header><pre>${esc(data[key])}</pre></section>`).join('')}</div><div class="merge-controls"><span id="conflict-count" class="muted"></span><div class="right flex">${['ours','theirs','both'].map(side=>`<button class="button small" data-resolution="${side}">Accept ${side==='theirs'?'incoming':side}</button>`).join('')}</div></div><div id="conflict-blocks" class="conflict-blocks"></div><label class="form-field"><span>MERGED RESULT · editable</span><textarea id="merge-result" spellcheck="false"></textarea></label><div class="form-error" id="merge-error" hidden></div></div><div class="dialog-footer"><button class="button" data-action="closeDialog">Cancel</button><button class="button primary" id="save-resolution">${icon('check')}Save & stage resolution</button></div>`,{wide:true,merge:true});

  fileHistory:d=>fileHistory(d.path),blame:d=>showBlame(d.path),resolveConflict:d=>resolveConflict(d.path),exportPatch:d=>exportPatch(d.oid,d.whole==='true'),importPatch,compareCommits:d=>compareCommits(d.oid),
  submoduleAdd:()=>simpleForm('submoduleAdd','Add a submodule',[{name:'url',label:'Remote URL',required:true},{name:'path',label:'Repository-relative destination',required:true}],{description:'Only add a repository you trust. This runs native Git and writes .gitmodules.',submit:'Add submodule'}),submoduleUpdate:()=>perform('submoduleUpdate',{},'Updating submodules'),lfsPull:()=>perform('lfsPull',{},'Downloading LFS objects'),lfsTrack:()=>simpleForm('lfsTrack','Track large files',[{name:'pattern',label:'File pattern',required:true,placeholder:'*.psd'}],{description:'Adds a pattern to .gitattributes. Commit that file to share the rule.',submit:'Track pattern'}),
  bisectStart:()=>simpleForm('bisect','Start a bisect session',[{name:'good',label:'Known good commit',required:true},{name:'bad',label:'Known bad commit',required:true,value:'HEAD'}],{args:{step:'start'},description:'Start from a clean working tree. Git checks out a candidate revision for you to test.',submit:'Start bisect'}),bisect:d=>perform('bisect',{step:d.step},'Bisect '+d.step),
  commitDialog,copy:d=>copy(d.text||d.value||S.commitOid||S.file?.path||''),
  filterBranch:async d=>{S.historyBranch=d.name||'';S.commitOid=null;S.inspectedCommit=null;if(S.view!=='history')await navigate('history');await refresh();},filterAuthor:async d=>{S.historyAuthor=d.name;await navigate('history');await refresh();},
  branchMenu:(d,e)=>contextForBranch(d.name||S.snapshot.status.branch.name,d.oid,e),commitMenu:(d,e)=>contextForCommit(d.oid||S.commitOid,e),fileMenu:(d,e)=>contextForFile(d.path||S.file?.path,d.mode||S.file?.mode,e),
  branchSwitch:(d,e)=>menu([{label:'CHECK OUT LOCAL BRANCH'},...S.snapshot.refs.filter(r=>r.type==='branch').map(r=>({text:r.name,action:'checkout',icon:r.current?'check':'branch',data:{ref:r.name}})),{separator:true},{text:'Create branch…',action:'createBranch',icon:'plus'}],e),
  historyFilter:(d,e)=>menu([{label:'HISTORY SCOPE'},{text:'All branches',action:'filterBranch',icon:'history',data:{name:''}},...S.snapshot.refs.map(r=>({text:r.name,action:'filterBranch',icon:r.type==='tag'?'tag':'branch',data:{name:r.full||r.name}}))],e),
  advancedHistory:async()=>{const v=await formDialog({title:'Focus the history',fields:[{name:'author',label:'Author contains',value:S.historyAuthor},{name:'path',label:'File path (optional)',value:S.historyPath}],submit:'Apply filters'});if(v){S.historyAuthor=v.author;S.historyPath=v.path;await refresh();}},loadMore:async()=>{S.limit=Math.min(5000,S.limit+500);await refresh();toast(S.limit>=5000?'Loaded-history limit is 5,000 commits. Use branch, author, message, and path filters for larger repositories.':'History window expanded.');},
  treeRevision:async()=>{const v=await formDialog({title:'Browse a revision',fields:[{name:'oid',label:'Branch or commit (empty for working tree)',value:S.treeOid||''}],submit:'Browse'});if(v&&await canNavigate()){S.treeOid=v.oid||null;S.editor=null;S.file=null;await buildMain();}},browseCommit:async d=>{S.treeOid=d.oid||S.commitOid;await navigate('files');},
  searchOpen:async d=>{await navigate('files');await openEditor(d.path);const area=$('#code-editor'),line=Number(d.line)||1;const offset=area.value.split('\n').slice(0,line-1).join('\n').length+(line>1?1:0);area.focus();area.setSelectionRange(offset,offset);area.scrollTop=Math.max(0,line*21-area.clientHeight/2);updateEditorStatus();},showSearch:()=>navigate('search'),
  toolsMenu:(d,e)=>menu([{label:'REPOSITORY TOOLS'},{text:'Open repository…',action:'openRepository',icon:'folder'},{text:'Search repository code…',action:'showSearch',icon:'search'},{text:'Create branch…',action:'createBranch',icon:'branch'},{text:'Merge…',action:'merge',icon:'merge'},{text:'Rebase…',action:'rebase',icon:'rebase'},{text:'Interactive rebase…',action:'interactiveRebase',icon:'rebase'},{text:'Stash changes…',action:'stashSave',icon:'stash'},{separator:true},{text:'Apply patch…',action:'importPatch',icon:'download'},{text:'Compare file revisions…',action:'compareCommits',icon:'split'},{text:'Reset current branch…',action:'reset',icon:'undo',danger:true},{separator:true},{text:'Settings & identity',action:'settings',icon:'settings'},{text:'Rendering diagnostics',action:'diagnostics',icon:'gpu'},{text:'Keyboard shortcuts',action:'shortcuts',icon:'command'}],e),

Object.assign(actions,{open:openRepository,about:diagnostics,theme:actions.toggleTheme,switchBranch:actions.branchSwitch,activityView:()=>navigate('activity'),performance:diagnostics,addRemote:actions.remoteAdd,diffSplit:actions.splitDiff,diffUnified:actions.unifiedDiff,stageSelection:actions.stageSelected,toggleFullContext:actions.toggleContext});

function bindEvents(){
  document.addEventListener('click',event=>{const target=event.target.closest('[data-action],[data-view]');if(!event.target.closest('#context-menu'))hideMenu();if(!target||target.disabled)return;const action=target.dataset.action,view=target.dataset.view;if(!action&&!view)return;event.preventDefault();const data={...target.dataset};if(event.target.closest('#context-menu'))hideMenu();Promise.resolve().then(()=>action?actions[action]?actions[action](data,event):Promise.reject(Error('Unknown UI action: '+action)):navigate(view)).catch(e=>{if(e?.name!=='AbortError')toast(e.message||String(e),true);});});
  document.addEventListener('contextmenu',event=>{const commit=event.target.closest('.commit-row'),branch=event.target.closest('[data-context="branch"]'),file=event.target.closest('[data-context="file"]');if(commit){event.preventDefault();contextForCommit(commit.dataset.oid,event);}else if(branch){event.preventDefault();contextForBranch(branch.dataset.name,branch.dataset.oid,event);}else if(file){event.preventDefault();contextForFile(file.dataset.path,file.dataset.mode,event);}});
  document.addEventListener('input',event=>{const el=event.target;if(el.dataset.draft){S.draft[el.dataset.draft]=el.type==='checkbox'?el.checked:el.value;const length=$('#summary-length');if(length)length.textContent=S.draft.summary.length+'/72';if(el.dataset.draft==='amend'){const button=$('#commit-button');if(button)button.disabled=(!S.snapshot.status.files.some(f=>f.staged)&&!el.checked)||S.snapshot.status.files.some(f=>f.conflict);}}if(el.id==='branch-search'){S.branchFilter=el.value;$$('.branch-item').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(el.value.toLowerCase()));}});
  document.addEventListener('keydown',event=>{const mod=event.ctrlKey||event.metaKey,typing=event.target.matches('input,textarea,select,[contenteditable="true"]'),key=event.key.toLowerCase();if(event.key==='Escape'){hideMenu();return;}if($('#dialog').open||$('#palette').open)return;
    if(mod&&key==='k'){event.preventDefault();commandPalette();}else if(mod&&key==='p'){event.preventDefault();commandPalette(true);}else if(mod&&key==='o'){event.preventDefault();openRepository().catch(e=>toast(e.message,true));}else if(mod&&key==='s'){event.preventDefault();if(S.editor)saveFile().catch(e=>toast(e.message,true));}else if(mod&&event.key==='Enter'){event.preventDefault();commitChanges().catch(e=>toast(e.message,true));}else if(mod&&event.shiftKey&&key==='r'){event.preventDefault();refresh().catch(e=>toast(e.message,true));}else if(event.altKey&&['1','2','3'].includes(key)){event.preventDefault();navigate(['history','changes','files'][Number(key)-1]).catch(e=>toast(e.message,true));}else if(!typing&&S.view==='history'&&['j','k','arrowdown','arrowup'].includes(key)){event.preventDefault();const index=S.snapshot.commits.findIndex(c=>c.oid===S.commitOid),next=Math.max(0,Math.min(S.snapshot.commits.length-1,index+(['j','arrowdown'].includes(key)?1:-1))),commit=S.snapshot.commits[next];if(commit){const scroll=$('#history-scroll');if(next*38<scroll.scrollTop)scroll.scrollTop=next*38;else if((next+1)*38>scroll.scrollTop+scroll.clientHeight)scroll.scrollTop=(next+1)*38-scroll.clientHeight;selectCommit(commit.oid).catch(e=>toast(e.message,true));}}else if(!typing&&event.key==='Enter'){event.target.closest('[data-action]')?.click();}});
  window.addEventListener('beforeunload',event=>{if(S.editor?.dirty){event.preventDefault();event.returnValue='';}});
  window.addEventListener('focus',()=>{if(S.snapshot&&!S.editor?.dirty&&!$('#dialog').open&&S.provider.kind==='native')refresh({quiet:true}).catch(()=>{});});
}
async function boot(){
  mountIcons();let theme;try{theme=localStorage.getItem('branchglass.theme');}catch{}setTheme(theme||'dark');
  for(const [saved,variable]of [['historyHeight','--history-height'],['sidebar-resizer','--sidebar-width'],['inspector-resizer','--inspector-width']]){const value=loadSetting(saved,null);if(value&&Number.isFinite(value))document.documentElement.style.setProperty(variable,value+'px');}
  bindEvents();setupResize();
  const hash=new URLSearchParams(location.hash.slice(1));let token=hash.get('token'),repo=hash.get('repo');try{if(token){sessionStorage.setItem('branchglass.bridgeToken',token);if(repo)sessionStorage.setItem('branchglass.initialRepo',repo);history.replaceState(null,'',location.pathname+location.search);}else {token=sessionStorage.getItem('branchglass.bridgeToken');repo=sessionStorage.getItem('branchglass.initialRepo');}}catch{}
  if(token&&/^https?:$/.test(location.protocol)){try{const bridge=new NativeProvider(token),info=await bridge.call('hello');S.bridge={token,info};const found=info.repos.find(r=>r.id===repo)||info.repos[0];if(found){bridge.repo=found;S.provider=bridge;rememberNative(found);}}catch(e){toast('Local bridge connection failed: '+e.message,true);}}
  await refresh();
  Object.defineProperty(window,'Branchglass',{value:Object.freeze({version:'0.1.0',diagnostics:()=>({provider:S.provider.kind,view:S.view,commits:S.snapshot?.commits.length,graph:S.graph?.mode||'not mounted',cpuGraphMs:S.graph?.lastRenderMs||0,graphVertices:S.graph?.vertices||0,historyDOM:$$('.commit-row').length,diffRows:S.diffRows.length,diffDOM:$$('.diff-row').length,worker:!!worker.worker,dirty:!!S.editor?.dirty}),refresh:()=>refresh()}),writable:false});
}
boot().catch(error=>{console.error(error);$('#workbench').innerHTML=empty('Branchglass could not start',error.message,'sandbox','Open sandbox','alert');toast(error.message,true);});
