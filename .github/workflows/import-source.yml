name: Verify browser publication

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium verification tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the browser and record sanitized results
        id: verify
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              chromium = p.chromium.executable_path
          result = subprocess.run(['python', 'tests/ui_smoke.py', '--chromium', chromium], capture_output=True, text=True, timeout=480)
          output = re.sub(r'\b[a-f0-9]{64}\b', '[redacted-token-or-digest]', result.stdout + result.stderr)
          output = re.sub(r'(https?://127\.0\.0\.1:\d+/?)#[^\s\"\']+', r'\1#[redacted]', output)
          Path('docs/results').mkdir(parents=True, exist_ok=True)
          Path('docs/results/publication-browser.json').write_text(json.dumps({'exit_code': result.returncode, 'output': output[-20000:]}, indent=2) + '\n')
          print(output)
          raise SystemExit(result.returncode)
          PY
      - name: Preserve the verification report and screenshots
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f docs/results/publication-browser.json; then
            git add -f docs/results/publication-browser.json
            test ! -f docs/results/ui.json || git add -f docs/results/ui.json
            test ! -d docs/screenshots || git add docs/screenshots
            if ! git diff --cached --quiet; then
              git commit -m 'test: record independent Chromium publication verification'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
