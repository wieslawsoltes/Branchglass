name: Import Branchglass source

on:
  push:
    branches: [main]
    paths: ['.import/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branchglass-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify the delivered source package
        run: |
          node --input-type=module <<'NODE'
          import {readdir, readFile, mkdir, writeFile, rm} from 'node:fs/promises';
          import {dirname, isAbsolute} from 'node:path';
          import {createHash} from 'node:crypto';
          import {brotliDecompressSync} from 'node:zlib';
          const parts = (await readdir('.import')).filter(p => /^\d{3}\.br$/.test(p)).sort();
          if (parts.length !== 9) throw new Error('Missing source package parts');
          const bytes = Buffer.concat(await Promise.all(parts.map(p => readFile('.import/' + p))));
          const digest = createHash('sha256').update(bytes).digest('hex');
          if (digest !== 'ca1ded28b890027504876007d6c66366763165cb25e4498035096d384ce9de15') throw new Error('Source package checksum mismatch');
          const files = JSON.parse(brotliDecompressSync(bytes).toString('utf8'));
          if (Object.keys(files).length !== 38) throw new Error('Unexpected source file count');
          for (const [name, text] of Object.entries(files)) {
            if (isAbsolute(name) || name.split('/').includes('..') || name.startsWith('.git/') || name.startsWith('.github/') || typeof text !== 'string') throw new Error('Invalid package path');
            await mkdir(dirname(name), {recursive: true});
            await writeFile(name, text);
          }
          await rm('.import', {recursive: true});
          console.log('Verified and restored', Object.keys(files).length, 'source files');
          NODE
      - name: Test and generate standalone preview
        run: |
          npm test
          npm run build:preview
      - name: Commit the application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Branchglass Git client, WebGPU renderer, native bridge, tests and documentation'
          git push origin HEAD:main
      - name: Install pinned browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify ordinary browser navigation and generate screenshots
        run: python tests/ui_smoke.py
      - name: Commit browser verification and screenshots
        run: |
          git add docs/screenshots docs/results
          if ! git diff --cached --quiet; then
            git commit -m 'test: verify native Git workflows in Chromium and capture workspace screenshots'
            git push origin HEAD:main
          fi
